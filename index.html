<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>if (!location.search.includes('v=')) { var s = '?v=fixed' + Date.now(); location.replace(location.pathname + s); }</script>
<title>Hi loveyy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Serif+Display&family=Lora:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
  }
  body {
    overflow-x: hidden;
  }

  body {
    background: #ece4d2;
    background-image:
      radial-gradient(ellipse at 20% 25%, rgba(214, 178, 162, 0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 82% 78%, rgba(196, 158, 152, 0.08) 0%, transparent 55%);
    font-family: 'Outfit', system-ui, sans-serif;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Paper grain — gives the "dirty" cream its texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.22  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.22;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }

  /* Subtle warm vignette */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(110, 80, 70, 0.12) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .hearts-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .heart {
    position: absolute;
    bottom: -60px;
    animation: float-up linear infinite;
    will-change: transform, opacity;
  }

  @keyframes float-up {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0;
    }
    8%   { opacity: var(--heart-opacity, 0.55); }
    50%  { transform: translate3d(calc(var(--drift, 0px) * 0.6), -55vh, 0) rotate(calc(var(--rotation, 0deg) * 0.5)); }
    92%  { opacity: var(--heart-opacity, 0.55); }
    100% {
      transform: translate3d(var(--drift, 0px), -115vh, 0) rotate(var(--rotation, 0deg));
      opacity: 0;
    }
  }

  .content {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px;
    opacity: 1;
    transition: opacity 0.85s ease;
  }
  .content.is-removed {
    animation: none;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes fade-in {
    from { opacity: 1; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: clamp(2.75rem, 8vw, 5.75rem);
    color: #8a6b6b;
    letter-spacing: -0.015em;
    line-height: 1.05;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 1.75rem;
    color: #b89a9a;
  }

  .ornament .line {
    width: 44px;
    height: 1px;
    background: currentColor;
    opacity: 0.55;
  }

  .ornament .dot-heart {
    color: #c89a9a;
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.18); opacity: 1; }
  }

  .tagline {
    margin-top: 1.5rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    color: #a08989;
    letter-spacing: 0.32em;
    text-transform: lowercase;
  }

  .cta {
    margin-top: 2.5rem;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 30px;
    background: rgba(255, 250, 245, 0.55);
    border: 1px solid rgba(184, 138, 138, 0.35);
    border-radius: 999px;
    color: #8a6b6b;
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 2px 10px rgba(180, 130, 130, 0.08);
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .cta:hover {
    background: rgba(232, 180, 180, 0.55);
    border-color: rgba(184, 138, 138, 0.65);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(180, 130, 130, 0.18);
  }
  .cta:active {
    transform: translateY(0) scale(0.97);
  }
  .cta .cta-heart {
    color: #c89a9a;
    transition: transform 0.4s ease;
  }
  .cta:hover .cta-heart {
    transform: scale(1.25) rotate(-8deg);
  }
  .cta.is-pulsing .cta-heart {
    animation: cta-pop 0.55s ease;
  }
  @keyframes cta-pop {
    0%   { transform: scale(1) rotate(0deg); }
    40%  { transform: scale(1.6) rotate(-12deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .cta.is-delivered {
    opacity: 0.55;
    pointer-events: none;
  }

  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    will-change: transform, opacity;
    animation: burst-out 1.4s ease-out forwards;
  }
  @keyframes burst-out {
    0%   { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; }
    50%  { transform: translate(calc(-50% + var(--bx, 0px) * 0.55), calc(-50% + var(--by, 0px) * 0.55)) scale(1) rotate(calc(var(--br, 0deg) * 0.55)); }
    100% { transform: translate(calc(-50% + var(--bx, 0px)), calc(-50% + var(--by, 0px))) scale(1) rotate(var(--br, 0deg)); opacity: 0; }
  }

  .message {
    margin-top: 2.5rem;
    max-width: 560px;
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-weight: 400;
    color: #7a5e5e;
    line-height: 1.55;
  }
  .message p {
    margin: 0;
    font-size: clamp(1.05rem, 2.4vw, 1.45rem);
    letter-spacing: 0.005em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .message p + p {
    margin-top: 0.7em;
  }
  .message p.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Bouquet + floating note — bouquet sits in front of all text and floats */
  .stage {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
  }
  .stage.is-popped { opacity: 1; pointer-events: auto; }

  .stage-inner {
    position: relative;
    display: inline-block;
    transform: scale(0.1) rotate(-14deg);
    opacity: 0;
  }
  .stage.is-popped .stage-inner {
    animation: pop-in 0.95s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .stage.is-floating .stage-inner {
    animation: float-bob 4.8s ease-in-out infinite;
  }
  @keyframes pop-in {
    0%   { opacity: 0; transform: scale(0.1)  rotate(-14deg); }
    55%  { opacity: 1; transform: scale(1.1)  rotate(4deg); }
    78%  {             transform: scale(0.96) rotate(-2deg); }
    100% { opacity: 1; transform: scale(1)    rotate(0deg); }
  }
  @keyframes float-bob {
    0%, 100% { opacity: 1; transform: translateY(0)    rotate(0deg)  scale(1); }
    50%      { opacity: 1; transform: translateY(-14px) rotate(1.5deg) scale(1); }
  }

  .bouquet {
    display: block;
    width: clamp(320px, 60vw, 600px);
    height: auto;
    filter: drop-shadow(0 28px 40px rgba(140, 50, 50, 0.28))
            drop-shadow(0 8px 12px rgba(140, 50, 50, 0.16));
  }

  /* Side stack: floater text + cute cat, beside or above the bouquet */
  .side {
    position: absolute;
    left: calc(100% + 22px);
    top: 4%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  .floater {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(1.4rem, 3.4vw, 2.1rem);
    color: #8a2f2f;
    line-height: 1.05;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    transform: rotate(-7deg);
    opacity: 0;
  }
  .floater.is-floating {
    animation: floater-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
               floater-bob 3.4s ease-in-out 0.6s infinite;
  }
  @keyframes floater-pop {
    0%   { opacity: 0; transform: rotate(-7deg) scale(0.4) translateY(6px); }
    100% { opacity: 1; transform: rotate(-7deg) scale(1)   translateY(0); }
  }
  @keyframes floater-bob {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    50%      { transform: rotate(-4deg) translateY(-5px); }
  }

  .cat {
    display: block;
    width: clamp(150px, 28vw, 250px);
    height: auto;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(120, 60, 60, 0.18);
    border: 3px solid rgba(255, 250, 245, 0.75);
    transform: rotate(2deg);
    opacity: 0;
  }
  .cat.is-popped {
    animation: cat-pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
               cat-bob 3.6s ease-in-out 0.65s infinite;
  }
  @keyframes cat-pop {
    0%   { opacity: 0; transform: rotate(2deg) translateY(10px) scale(0.5); }
    100% { opacity: 1; transform: rotate(2deg) translateY(0)    scale(1); }
  }
  @keyframes cat-bob {
    0%, 100% { transform: rotate(2deg) translateY(0); }
    50%      { transform: rotate(2deg) translateY(-6px); }
  }

  /* "Tap the envelope" hint below the bouquet */
  .hint {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    margin-top: 18px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(1.2rem, 3.2vw, 1.6rem);
    color: #8a2f2f;
    white-space: nowrap;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
  }
  .hint.is-visible {
    opacity: 1;
    animation: hint-bob 1.8s ease-in-out infinite;
  }
  .hint-arrow {
    display: block;
    font-family: 'Outfit', sans-serif;
    font-size: 1.4em;
    line-height: 1;
    margin-bottom: 2px;
    color: #b04050;
  }
  @keyframes hint-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }

  /* Envelope click target on the bouquet */
  .envelope-target {
    position: absolute;
    left: 38%;
    top: 8%;
    width: 26%;
    height: 22%;
    z-index: 1;
    cursor: pointer;
    border-radius: 8px;
    background: transparent;
    transition: box-shadow 0.45s ease, transform 0.45s ease;
  }
  .envelope-target:hover,
  .envelope-target:focus-visible {
    box-shadow: 0 0 28px 6px rgba(255, 190, 190, 0.55);
    transform: scale(1.08);
    outline: none;
  }
  .envelope-target.is-pulsing {
    animation: envelope-pulse 0.5s ease;
  }
  @keyframes envelope-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(0.92); }
  }

  /* Hidden letter with torn top/bottom edges */
  .letter {
    position: fixed;
    right: calc(50% + 320px);
    top: 50%;
    transform: translateY(-50%) rotate(-2deg) scale(0.96);
    width: clamp(300px, 34vw, 380px);
    background: #ede4d0;
    color: #6b5b4f;
    padding: 42px 34px 38px;
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
    font-size: clamp(0.82rem, 1.35vw, 0.9rem);
    line-height: 1.6;
    text-align: left;
    box-shadow: 0 14px 44px rgba(100, 70, 60, 0.22);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 1.2s ease, transform 1.2s ease;
    -webkit-clip-path: polygon(0% 7%, 10% 0%, 20% 7%, 30% 0%, 40% 7%, 50% 0%, 60% 7%, 70% 0%, 80% 7%, 90% 0%, 100% 7%, 100% 93%, 90% 100%, 80% 93%, 70% 100%, 60% 93%, 50% 100%, 40% 93%, 30% 100%, 20% 93%, 10% 100%, 0% 93%);
            clip-path: polygon(0% 7%, 10% 0%, 20% 7%, 30% 0%, 40% 7%, 50% 0%, 60% 7%, 70% 0%, 80% 7%, 90% 0%, 100% 7%, 100% 93%, 90% 100%, 80% 93%, 70% 100%, 60% 93%, 50% 100%, 40% 93%, 30% 100%, 20% 93%, 10% 100%, 0% 93%);
  }
  .letter.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) rotate(-2deg) scale(1);
  }
  .letter p { margin: 0; }
  .letter-body { margin-bottom: 1.1em !important; }
  .letter-sign {
    text-align: right;
    font-family: 'Caveat', cursive;
    font-size: 1.5em;
    color: #8a2f2f;
    margin-top: 0.4em !important;
  }
  .letter-close {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 26px;
    height: 26px;
    background: none;
    border: none;
    color: #a09080;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    transition: color 0.25s ease;
  }
  .letter-close:hover { color: #6b5b4f; }

  /* ───── Music player widget (lower right corner) ───── */
  .music-player {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px 8px 12px;
    background: rgba(255, 252, 248, 0.92);
    border: 1px solid rgba(200, 170, 160, 0.28);
    border-radius: 999px;
    box-shadow: 0 8px 28px rgba(120, 80, 70, 0.18), 0 2px 6px rgba(120, 80, 70, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    max-width: calc(100vw - 44px);
    animation: mp-enter 0.8s ease-out 0.6s both;
  }
  @keyframes mp-enter {
    from { opacity: 1; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .mp-heart {
    background: none;
    border: none;
    color: #c4566a;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: mp-heartbeat 1.6s ease-in-out infinite;
  }
  .mp-heart svg { width: 18px; height: 18px; display: block; }
  .mp-heart.is-popped { animation: mp-heart-pop 0.5s ease; }
  @keyframes mp-heartbeat {
    0%, 60%, 100% { transform: scale(1); }
    30% { transform: scale(1.18); }
  }
  @keyframes mp-heart-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
  .mp-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 110px;
  }
  .mp-title {
    font-family: 'Caveat', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    color: #6b5b4f;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .mp-progress {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .mp-progress-track {
    width: 100%;
    height: 4px;
    background: rgba(180, 150, 140, 0.32);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .mp-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e8a0a0, #c4566a);
    border-radius: 2px;
    transition: width 0.12s linear;
  }
  .mp-play {
    background: linear-gradient(135deg, #f0b8c0, #e89098);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 3px 10px rgba(196, 86, 106, 0.4);
    padding: 0;
  }
  .mp-play:hover { transform: scale(1.08); box-shadow: 0 4px 14px rgba(196, 86, 106, 0.5); }
  .mp-play:active { transform: scale(0.94); }
  .mp-play svg { width: 16px; height: 16px; display: block; }
  .mp-play .mp-icon-pause { display: none; }
  .mp-play.is-playing .mp-icon-play { display: none; }
  .mp-play.is-playing .mp-icon-pause { display: block; }
  .mp-volume {
    background: none;
    border: none;
    color: #a09080;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
  }
  .mp-volume:hover { color: #6b5b4f; }
  .mp-volume svg { width: 18px; height: 18px; display: block; }
  .mp-volume .mp-vol-off { display: none; }
  .mp-volume.is-muted { color: #c4a8a0; }
  .mp-volume.is-muted .mp-vol-on { display: none; }
  .mp-volume.is-muted .mp-vol-off { display: block; }

  /* ───── PHONE (< 640px): stacked, letter as centered modal ───── */
  @media (max-width: 1023px) {
    .bouquet { width: clamp(360px, 98vw, 580px); }
    .side {
      left: 50%;
      top: auto;
      bottom: calc(100% + 14px);
      transform: translateX(-50%);
      align-items: center;
      gap: 10px;
    }
    .floater { font-size: 1.8rem; text-align: center; }
    .cat { width: clamp(200px, 62vw, 320px); border-width: 2px; }
    .letter {
      right: auto;
      left: 50%;
      top: 50%;
      bottom: auto;
      transform: translate(-50%, -50%) rotate(-1.5deg) scale(0.96);
      width: 88vw;
      max-width: 380px;
      max-height: 86vh;
      overflow-y: auto;
      font-size: clamp(0.95rem, 4.2vw, 1.1rem);
      padding: 44px 34px 40px;
    }
    .letter.is-visible { transform: translate(-50%, -50%) rotate(-1.5deg) scale(1); }
  }

  /* ───── TABLET (640–1023px): two-column — letter LEFT, bouquet RIGHT ───── */
  @media (min-width: 1024px) and (max-width: 1439px) {
    .stage {
      right: 4vw;
      left: auto;
      top: 50%;
      transform: translateY(-50%);
    }
    .bouquet { width: clamp(220px, 38vw, 320px); }
    .side {
      left: 50%;
      top: auto;
      bottom: calc(100% + 14px);
      transform: translateX(-50%);
      align-items: center;
      gap: 10px;
    }
    .floater { font-size: 1.2rem; text-align: center; }
    .cat { width: clamp(90px, 18vw, 140px); border-width: 2px; }
    .letter {
      right: auto;
      left: 4vw;
      top: 50%;
      bottom: auto;
      transform: translateY(-50%) rotate(-1.5deg) scale(0.96);
      width: clamp(220px, 32vw, 300px);
      max-height: 82vh;
      overflow-y: auto;
    }
    .letter.is-visible { transform: translateY(-50%) rotate(-1.5deg) scale(1); }
  }

  /* ───── LANDSCAPE / SHORT VIEWPORTS (any device < 1024px, < 800px tall):
     compact the bouquet + side so the whole composition fits vertically. ───── */
  @media (max-width: 1023px) and (max-height: 799px) {
    .bouquet { width: clamp(170px, 40vw, 250px); }
    .side { gap: 8px; bottom: calc(100% + 10px); }
    .floater { font-size: 1.15rem; }
    .cat { width: clamp(90px, 18vw, 130px); }
  }

</head>
<body>
  <div class="hearts-layer" id="hearts" aria-hidden="true"></div>

  <div class="stage" id="stage" aria-hidden="true">
    <div class="stage-inner">
      <img class="bouquet" src="rose-bouquet.png" alt="A bouquet of red roses">
      <div class="envelope-target" id="envelopeTarget" role="button" tabindex="0" aria-label="Open the letter"></div>
      <div class="side">
        <div class="floater" id="floater">Fl0WeRs 4 U L0V3<br>ekSzdi!’’</div>
        <img class="cat" id="cat" src="cutecute.png" alt="A cute cat">
      </div>
    </div>
    <div class="hint" id="hint" aria-hidden="true"><span class="hint-arrow" aria-hidden="true">↑</span>Tap the envelope</div>
  </div>

  <div class="letter" id="letter" role="dialog" aria-modal="false" aria-label="A letter for you" aria-hidden="true">
    <button class="letter-close" id="letterClose" type="button" aria-label="Close letter">×</button>
    <p class="letter-body">Congratulations on your pinning, love!<br><br>I wish I could be there today with you and give you some flowers.<br><br>But sadly, di pako kahibaw mo teleport haha...<br><br>So I made this little website to send you some flowers instead.<br><br>I’m really proud of you and everything you’ve worked so hard for. You made it this far, and now you’re taking another big step toward your dreams.<br><br>Good luck on your OJT. Mwaaa!</p>
    <p class="letter-sign">— lablab ❤️</p>
  </div>

  <main class="content">
    <h1>Hi loveyy</h1>
    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <span class="dot-heart">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span class="line"></span>
    </div>
    <p class="tagline">a little page just for you</p>

    <button class="cta" id="cta" type="button" aria-label="click here">
      <span class="cta-heart" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span>click here</span>
    </button>

    <div class="message" id="message" aria-live="polite">
      <p id="msg1">“I couldn’t bring you flowers in person…”</p>
      <p id="msg2">“…so I brought you here instead.”</p>
    </div>
  </main>

  <div class="music-player" id="musicPlayer" aria-label="Our song music player">
    <button class="mp-heart" id="mpHeart" type="button" aria-label="Heart">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
    <div class="mp-info">
      <span class="mp-title">Now Playing</span>
      <div class="mp-progress" id="mpProgress" role="progressbar" aria-label="Song progress">
        <div class="mp-progress-track">
          <div class="mp-progress-fill" id="mpProgressFill"></div>
        </div>
      </div>
    </div>
    <button class="mp-play" id="mpPlay" type="button" aria-label="Play song">
      <svg class="mp-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="mp-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="mp-volume" id="mpVolume" type="button" aria-label="Mute">
      <svg class="mp-vol-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg class="mp-vol-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <audio id="mpAudio" src="our-song.mp3?v=3" preload="metadata" loop></audio>
  </div>

<script>
  (function () {
    const container = document.getElementById('hearts');
    // Soft, dusty rose tones — keeps the page gentle on the warm cream
    const palette = [
      '#d4a5a5', '#c98888', '#e0b0b0', '#b87878',
      '#e8b4b4', '#cf9595', '#d9a3a3', '#c47e7e'
    ];

    const COUNT = 48;

    for (let i = 0; i < COUNT; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';

      const size = 6 + Math.random() * 18;          // 6–24px
      const left = Math.random() * 100;              // % from left
      const duration = 11 + Math.random() * 16;      // 11–27s
      const delay = -Math.random() * 28;             // stagger start
      const drift = (Math.random() - 0.5) * 160;    // -80 to 80 px
      const rotation = (Math.random() - 0.5) * 90;   // -45° to 45°
      const opacity = 0.32 + Math.random() * 0.45;   // 0.32–0.77
      const color = palette[Math.floor(Math.random() * palette.length)];

      heart.style.left = left + 'vw';
      heart.style.setProperty('--drift', drift + 'px');
      heart.style.setProperty('--rotation', rotation + 'deg');
      heart.style.setProperty('--heart-opacity', opacity.toFixed(2));
      heart.style.animationDuration = duration.toFixed(2) + 's';
      heart.style.animationDelay = delay.toFixed(2) + 's';

      heart.innerHTML =
        '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '">' +
          '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' +
        '</svg>';

      container.appendChild(heart);
    }

    // Heart burst on button click
    const cta = document.getElementById('cta');
    const burstPalette = ['#d4a5a5', '#c98888', '#e0b0b0', '#b87878', '#e8b4b4', '#cf9595', '#d9a3a3'];
    const petalPalette = ['#e8a4a4', '#d48888', '#c47878', '#f0bcbc', '#b86868', '#dca0a0', '#e8c4c4', '#cc7878', '#f2c4c4', '#a85858'];
    const msg1 = document.getElementById('msg1');
    const msg2 = document.getElementById('msg2');
    const stage = document.getElementById('stage');
    const floater = document.getElementById('floater');
    const cat = document.getElementById('cat');
    const content = document.querySelector('.content');
    const envelopeTarget = document.getElementById('envelopeTarget');
    const hint = document.getElementById('hint');
    const letter = document.getElementById('letter');
    const letterClose = document.getElementById('letterClose');
    let letterOpen = false;
    let messageShown = false;

    function spawnBurst(cx, cy) {
      const count = 14;
      for (let i = 0; i < count; i++) {
        const b = document.createElement('span');
        b.className = 'burst';
        const size = 8 + Math.random() * 14;
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const dist = 90 + Math.random() * 70;
        const bx = Math.cos(angle) * dist;
        const by = Math.sin(angle) * dist;
        const rot = (Math.random() - 0.5) * 120;
        const color = burstPalette[Math.floor(Math.random() * burstPalette.length)];

        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        b.style.setProperty('--bx', bx + 'px');
        b.style.setProperty('--by', by + 'px');
        b.style.setProperty('--br', rot + 'deg');

        b.innerHTML =
          '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '">' +
            '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' +
          '</svg>';

        document.body.appendChild(b);
        b.addEventListener('animationend', function () { b.remove(); });
      }
    }

    // Rose-petal burst when the bouquet pops
    const PETAL_PATH = '<path d="M12 2 C 18 4, 19 14, 12 22 C 5 14, 6 4, 12 2 Z"/>';

    function spawnPetalBurst(cx, cy) {
      const count = 26;
      for (let i = 0; i < count; i++) {
        const b = document.createElement('span');
        b.className = 'burst';
        const size = 12 + Math.random() * 14;             // 12–26px
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
        const dist = 220 + Math.random() * 200;           // 220–420px (well past the bouquet)
        const bx = Math.cos(angle) * dist;
        const by = Math.sin(angle) * dist;
        const rot = (Math.random() - 0.5) * 720;          // full tumble (-360° to 360°)
        const color = petalPalette[Math.floor(Math.random() * petalPalette.length)];

        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        b.style.zIndex = '11';                            // float above the bouquet
        b.style.setProperty('--bx', bx + 'px');
        b.style.setProperty('--by', by + 'px');
        b.style.setProperty('--br', rot + 'deg');

        b.innerHTML =
          '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '">' +
            PETAL_PATH +
          '</svg>';

        document.body.appendChild(b);
        b.addEventListener('animationend', function () { b.remove(); });
      }
    }

    cta.addEventListener('click', function (e) {
      // little heart pop on the button itself
      cta.classList.remove('is-pulsing');
      void cta.offsetWidth;
      cta.classList.add('is-pulsing');

      const rect = cta.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

      if (!messageShown) {
        messageShown = true;
        // First line fades in shortly after click, second line 2s later
        setTimeout(function () { msg1.classList.add('is-visible'); }, 450);
        setTimeout(function () { msg2.classList.add('is-visible'); }, 450 + 2000);
        // Bouquet pops in 5 seconds after "...so I brought you here instead" lands
        setTimeout(function () {
          stage.classList.add('is-popped');
          stage.style.pointerEvents = 'auto';
          content.classList.add('is-removed');
          // Petal burst from the center of the viewport (where the bouquet is)
          spawnPetalBurst(window.innerWidth / 2, window.innerHeight / 2);
          // Show the "tap the envelope" hint
          hint.classList.add('is-visible');
        }, 450 + 2000 + 5000);
        // Floating note joins after the pop
        setTimeout(function () { floater.classList.add('is-floating'); }, 450 + 2000 + 5000 + 380);
        // Cute cat pops in below the text
        setTimeout(function () { cat.classList.add('is-popped'); }, 450 + 2000 + 5000 + 900);
        // Whole composition (bouquet + text) starts floating after the pop settles
        setTimeout(function () { stage.classList.add('is-floating'); }, 450 + 2000 + 5000 + 1100);
        // Gently fade the button once the bouquet is delivered
        setTimeout(function () { cta.classList.add('is-delivered'); }, 450 + 2000 + 5000 + 1100);
      }
    });

    // Envelope click → toggle the letter
    function toggleLetter() {
      letterOpen = !letterOpen;
      // little pulse on the envelope target
      envelopeTarget.classList.remove('is-pulsing');
      void envelopeTarget.offsetWidth;
      envelopeTarget.classList.add('is-pulsing');

      if (letterOpen) {
        letter.classList.add('is-visible');
        letter.setAttribute('aria-hidden', 'false');
        // hide the hint once the letter is opened
        hint.classList.remove('is-visible');
      } else {
        letter.classList.remove('is-visible');
        letter.setAttribute('aria-hidden', 'true');
      }
    }

    envelopeTarget.addEventListener('click', toggleLetter);
    envelopeTarget.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleLetter();
      }
    });
    letterClose.addEventListener('click', function () {
      if (letterOpen) toggleLetter();
    });

    // ───── Music player ─────
    const mpAudio = document.getElementById('mpAudio');
    const mpPlay = document.getElementById('mpPlay');
    const mpProgress = document.getElementById('mpProgress');
    const mpProgressFill = document.getElementById('mpProgressFill');
    const mpVolume = document.getElementById('mpVolume');
    const mpHeart = document.getElementById('mpHeart');

    mpPlay.addEventListener('click', function () {
      if (mpAudio.paused) {
        const p = mpAudio.play();
        if (p && p.catch) p.catch(function () { /* file missing or autoplay blocked */ });
      } else {
        mpAudio.pause();
      }
    });

    mpAudio.addEventListener('play', function () { mpPlay.classList.add('is-playing'); });
    mpAudio.addEventListener('pause', function () { mpPlay.classList.remove('is-playing'); });
    mpAudio.addEventListener('timeupdate', function () {
      if (mpAudio.duration && isFinite(mpAudio.duration)) {
        mpProgressFill.style.width = ((mpAudio.currentTime / mpAudio.duration) * 100) + '%';
      }
    });
    mpAudio.addEventListener('ended', function () {
      mpPlay.classList.remove('is-playing');
      mpProgressFill.style.width = '0%';
    });
    // When metadata loads, make sure the bar is at 0
    mpAudio.addEventListener('loadedmetadata', function () {
      mpProgressFill.style.width = '0%';
    });

    mpProgress.addEventListener('click', function (e) {
      if (!mpAudio.duration || !isFinite(mpAudio.duration)) return;
      const rect = mpProgress.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      mpAudio.currentTime = pct * mpAudio.duration;
    });

    mpVolume.addEventListener('click', function () {
      mpAudio.muted = !mpAudio.muted;
      mpVolume.classList.toggle('is-muted', mpAudio.muted);
    });

    mpHeart.addEventListener('click', function () {
      mpHeart.classList.remove('is-popped');
      void mpHeart.offsetWidth;
      mpHeart.classList.add('is-popped');
    });

    // ───── Auto-play with gentle fade-in ─────
    // Most browsers block unmuted autoplay on page load. We:
    //  (1) try once on load (silent if blocked), and
    //  (2) start the song on the FIRST user interaction anywhere
    //      (click / tap / key) — which is guaranteed because the page
    //      requires a click on "click here" to begin the experience.
    // The volume fades in from 0 to ~1 over ~1.25s so it never feels abrupt.
    var _fadeId = null;
    function playWithFade() {
      var target = (typeof mpAudio.volume === 'number' && mpAudio.volume > 0)
        ? mpAudio.volume : 1;
      try { mpAudio.volume = 0; } catch (e) {}
      var p = null;
      try { p = mpAudio.play(); } catch (e) { p = null; }
      if (p && p.catch) p.catch(function () { /* blocked or file missing */ });
      if (_fadeId) clearInterval(_fadeId);
      var v = 0;
      _fadeId = setInterval(function () {
        v = Math.min(target, v + 0.04);
        try { mpAudio.volume = v; } catch (e) {}
        if (v >= target - 0.001) {
          clearInterval(_fadeId); _fadeId = null;
          try { mpAudio.volume = target; } catch (e) {}
        }
      }, 50);
    }

    // (1) attempt autoplay on load — silently fails if blocked
    playWithFade();

    // (2) reliable fallback: first interaction anywhere unlocks audio
    function firstTouchPlay() {
      playWithFade();
      document.removeEventListener('click', firstTouchPlay, true);
      document.removeEventListener('pointerdown', firstTouchPlay, true);
      document.removeEventListener('touchstart', firstTouchPlay, true);
      document.removeEventListener('keydown', firstTouchPlay, true);
    }
    document.addEventListener('click', firstTouchPlay, true);
    document.addEventListener('pointerdown', firstTouchPlay, true);
    document.addEventListener('touchstart', firstTouchPlay, true);
    document.addEventListener('keydown', firstTouchPlay, true);
  })();
</script>
</body>
